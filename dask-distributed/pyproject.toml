[project]
name = "ocs-stack-dask-distributed"
version = "0.1.0"
description = "Learning dask.distributed against a real multi-container cluster run with Docker Compose"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.9.2",
    "dask[complete]>=2026.7.1",
    "distributed>=2026.7.1",
    "xarray>=2026.7.0",
    "zarr>=3.3.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ocs_stack_dask_distributed"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]
"examples/**/*.py" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", ".git", ".venv", "__pycache__"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ocs_stack_dask_distributed"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false
