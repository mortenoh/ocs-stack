site_name: playground-python
site_description: "Learning the xarray, dask, and icechunk stack behind open-climate-service"

theme:
  name: material
  palette:
    # Dark first, so that is what a visitor gets by default. The light scheme
    # stays available behind the toggle.
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Written:
      - The stack: stack.md
      - Scaling: scaling.md
      - Storage: storage.md
      - Open Climate Service: open-climate-service.md
      - Conventions: conventions.md
  - Projects:
      - xarray: projects/xarray.md
      - dask: projects/dask.md
      - dask-distributed: projects/dask-distributed.md
      - icechunk: projects/icechunk.md
      - climate-pipeline: projects/climate-pipeline.md
  - API reference:
      - xarray: reference/xarray.md
      - dask: reference/dask.md
      - dask-distributed: reference/dask-distributed.md
      - icechunk: reference/icechunk.md
      - climate-pipeline: reference/climate-pipeline.md

# The project pages link to example and library source with paths relative to
# the repository root, so they resolve on GitHub and in an editor -- the way
# these files are usually read. mkdocs cannot follow a link outside docs_dir
# and would warn on every one, so that check is off here; a script in
# scripts/check-links.sh validates the same links against the filesystem.
# Anchors are still validated, and absolute links still warn.
validation:
  links:
    not_found: ignore
    anchors: warn
    absolute_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # griffe reads these statically, so building the docs needs none of
          # the projects' dependencies installed -- no root virtualenv, no
          # workspace, nothing to keep in sync.
          paths:
            - xarray/src
            - dask/src
            - dask-distributed/src
            - icechunk/src
            - climate-pipeline/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            members_order: source
            heading_level: 2
