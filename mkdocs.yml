site_name: playground-python
site_description: "Learning the xarray, dask, and icechunk stack behind open-climate-service"

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Written:
      - The stack: stack.md
      - Scaling: scaling.md
      - Storage: storage.md
      - Open Climate Service: open-climate-service.md
      - Conventions: conventions.md
  - Projects:
      - start: projects/start.md
      - xarray: projects/xarray.md
      - dask: projects/dask.md
      - dask-distributed: projects/dask-distributed.md
      - icechunk: projects/icechunk.md
      - climate: projects/climate.md
  - API reference:
      - start: reference/start.md
      - xarray: reference/xarray.md
      - dask: reference/dask.md
      - dask-distributed: reference/dask-distributed.md
      - icechunk: reference/icechunk.md
      - climate: reference/climate.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # griffe reads these statically, so building the docs needs none of
          # the projects' dependencies installed -- no root virtualenv, no
          # workspace, nothing to keep in sync.
          paths:
            - start/src
            - xarray/src
            - dask/src
            - dask-distributed/src
            - icechunk/src
            - climate/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            members_order: source
            heading_level: 2
